version: '3.8'
services:
  server:
    build:
      context: ./CodeBase/server
      dockerfile: Dockerfile
    volumes:
      - ./CodeBase/server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    ports:
      - "5000:5000"

  client:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./CodeBase/client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - server

networks:
  default:
    driver: bridge
